ServerName localhost
<VirtualHost *:8081>
  ProxyPreserveHost On
  ProxyTimeout 120
  Alias /assets /opt/tactic/assets
  <Directory /opt/tactic/assets>
    Options -Indexes
    Require all granted
  </Directory>
  Alias /context /opt/tactic/tactic/src/context
  <Directory /opt/tactic/tactic/src/context>
    Options -Indexes
    Require all granted
  </Directory>
  ProxyPass /assets !
  ProxyPass /context !
  <Proxy balancer://tactic>
    BalancerMember http://127.0.0.1:8082
    BalancerMember http://127.0.0.1:8083
  </Proxy>
  ProxyPass / balancer://tactic/
  ProxyPassReverse / balancer://tactic/
  ErrorLog /proc/self/fd/2
  # REST paths can contain tickets; do not write access logs.
  CustomLog /dev/null combined
</VirtualHost>
